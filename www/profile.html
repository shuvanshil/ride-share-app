<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoYatra Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="profile-page">
        <header class="profile-app-head">
            <div class="brand-logo"><span>Go</span><span>Yatra</span></div>
        </header>

        <section class="profile-title-block">
            <h1>Profile</h1>
        </section>

        <section class="profile-user-card">
            <div class="profile-avatar" id="profile-avatar">👤</div>
            <div class="profile-user-copy">
                <h2 id="profile-user-name">GoYatra User</h2>
                <p id="profile-user-phone">Loading phone number...</p>
            </div>
            <button id="profile-edit-btn" class="profile-edit-btn" type="button">Edit</button>
        </section>

        <section class="profile-menu" aria-label="Profile menu">
            <button class="profile-menu-row" type="button" data-action="rides">
                <span class="profile-menu-icon">◷</span>
                <span>My Rides</span>
                <strong>›</strong>
            </button>
            <button class="profile-menu-row" type="button" data-action="safety">
                <span class="profile-menu-icon">盾</span>
                <span>Safety</span>
                <strong>›</strong>
            </button>
            <button class="profile-menu-row" type="button" data-action="refer">
                <span class="profile-menu-icon">↗</span>
                <span>Refer</span>
                <strong>›</strong>
            </button>
            <button class="profile-menu-row" type="button" data-action="contact">
                <span class="profile-menu-icon">☎</span>
                <span>Contact Us</span>
                <strong>›</strong>
            </button>
            <button class="profile-menu-row" type="button" data-action="about">
                <span class="profile-menu-icon">ⓘ</span>
                <span>About Us</span>
                <strong>›</strong>
            </button>
            <button class="profile-menu-row" type="button" data-action="help">
                <span class="profile-menu-icon">?</span>
                <span>Help</span>
                <strong>›</strong>
            </button>
        </section>

        <section class="profile-footer-actions">
            <button id="profile-logout-btn" class="profile-logout-btn" type="button">Log out</button>
        </section>

        <nav class="bottom-nav profile-bottom-nav">
            <button type="button" onclick="window.location.href='index.html'"><span>⌂</span>Home</button>
            <button type="button" onclick="window.location.href='services.html'"><span>▦</span>Services</button>
            <button type="button" onclick="window.location.href='history.html'"><span>◷</span>History</button>
            <button class="active" type="button"><span>○</span>Profile</button>
        </nav>
    </main>

    <script type="module">
        import { auth, db } from './js/firebase-init.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const nameEl = document.getElementById('profile-user-name');
        const phoneEl = document.getElementById('profile-user-phone');
        const avatarEl = document.getElementById('profile-avatar');

        function getInitials(name) {
            return String(name || "G")
                .trim()
                .split(/\s+/)
                .slice(0, 2)
                .map((part) => part[0]?.toUpperCase() || "")
                .join("") || "G";
        }

        function bindProfileActions() {
            document.querySelector('[data-action="rides"]').addEventListener('click', () => {
                window.location.href = 'history.html';
            });
            document.querySelector('[data-action="contact"]').addEventListener('click', () => {
                window.location.href = 'mailto:support@goyatra.app';
            });
            document.querySelector('[data-action="help"]').addEventListener('click', () => {
                alert('GoYatra support will be connected here.');
            });
            document.querySelector('[data-action="safety"]').addEventListener('click', () => {
                alert('Safety center coming soon.');
            });
            document.querySelector('[data-action="refer"]').addEventListener('click', () => {
                alert('Referral program coming soon.');
            });
            document.querySelector('[data-action="about"]').addEventListener('click', () => {
                alert('GoYatra is a local ride-hailing platform for Tripura.');
            });
            document.getElementById('profile-edit-btn').addEventListener('click', () => {
                alert('Profile editing will be available from the account settings panel.');
            });
            document.getElementById('profile-logout-btn').addEventListener('click', async () => {
                await signOut(auth);
                window.location.href = 'index.html';
            });
        }

        bindProfileActions();

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                nameEl.innerText = "Guest User";
                phoneEl.innerText = "Login to view your profile";
                avatarEl.innerText = "G";
                return;
            }

            try {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                const profile = userSnap.exists() ? userSnap.data() : {};
                const displayName = profile.name || user.displayName || "GoYatra User";
                const phone = profile.phone || user.phoneNumber || "Phone number unavailable";

                nameEl.innerText = displayName;
                phoneEl.innerText = phone;

                if (profile.profilePhotoUrl) {
                    avatarEl.replaceChildren();
                    const photo = document.createElement('img');
                    photo.src = profile.profilePhotoUrl;
                    photo.alt = displayName;
                    avatarEl.appendChild(photo);
                } else {
                    avatarEl.innerText = getInitials(displayName);
                }
            } catch (error) {
                console.error("Profile load failed:", error);
                nameEl.innerText = "GoYatra User";
                phoneEl.innerText = user.phoneNumber || "Phone number unavailable";
                avatarEl.innerText = "G";
            }
        });
    </script>
</body>
</html>
