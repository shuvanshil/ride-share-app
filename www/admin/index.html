<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>LiphtUp Admin</title>
</head>
<body>
    <script>
        fetch("/api/admin-console-static/index.html", { credentials: "same-origin" })
            .then((response) => {
                if (!response.ok) throw new Error("Admin console is unavailable.");
                return response.text();
            })
            .then((html) => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(() => {
                document.body.innerHTML = "<main style=\"font-family: system-ui, sans-serif; padding: 2rem;\"><h1>Admin console unavailable</h1><p>The admin_console directory is missing or could not be loaded.</p></main>";
            });
    </script>
</body>
</html>
