<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/platform/native-bridge.js"></script>
    <script src="js/platform/routes.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#166534">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LiphtUp">
    <title>LiphtUp Login | Passenger &amp; Driver Sign In</title>
    <meta name="robots" content="index, follow">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/liphtup-icon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260823-redesign-v2">
</head>
<body class="login-page">
    <div id="initial-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity 0.4s ease,visibility 0.4s ease;">
        <div style="width:42px;height:42px;border:4px solid #f3f3f3;border-top:4px solid #166534;border-radius:50%;animation:lu-spin 0.8s linear infinite;"></div>
        <style>@keyframes lu-spin { to { transform: rotate(360deg); } }</style>
        <div style="margin-top:16px;font-family:sans-serif;font-weight:700;color:#166534;font-size:14px;letter-spacing:0.5px;">LiphtUp</div>
    </div>

    <!-- Sticky Header Bar matching Home page approach -->
    <header class="app-bar auth-app-bar">
        <div class="brand-logo">
            <img src="assets/branding/liphtup-logo.jpeg" alt="LiphtUp">
        </div>
        <div id="auth-lang-switcher" class="app-bar-actions"></div>
    </header>

    <main class="auth-container">
        <section class="auth-card auth-card-redesign">

            <!-- Hero Section: Heading, Bullet Features & Illustration -->
            <div class="auth-hero-row mb-4">
                <div class="auth-hero-left">
                    <h1 id="auth-entry-title" class="auth-hero-title" data-i18n="auth.welcome_back">Welcome back!</h1>
                    <p id="auth-entry-copy" class="auth-hero-sub" data-i18n="auth.login_sub">Login to continue your journey with LiphtUp.</p>
                    
                    <div class="auth-feature-list">
                        <div class="auth-feature-item">
                            <span class="auth-feature-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                    <path d="m9 12 2 2 4-4"/>
                                </svg>
                            </span>
                            <span data-i18n="auth.feature_safe">Safe &amp; reliable rides</span>
                        </div>
                        <div class="auth-feature-item">
                            <span class="auth-feature-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                                    <circle cx="12" cy="10" r="3"/>
                                </svg>
                            </span>
                            <span data-i18n="auth.feature_trusted">Trusted by locals</span>
                        </div>
                        <div class="auth-feature-item">
                            <span class="auth-feature-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                                </svg>
                            </span>
                            <span data-i18n="auth.feature_fast">Fast, convenient &amp; affordable</span>
                        </div>
                    </div>
                </div>

                <div class="auth-hero-right">
                    <img src="assets/auth-illustration.png" alt="Ride illustration" class="auth-illustration">
                </div>
            </div>

            <!-- Mode Switcher (Login / Register) -->
            <div id="auth-mode-switch-bar" class="auth-mode-switch mb-4" role="tablist">
                <button id="login-mode-btn" class="auth-mode-btn active" type="button" role="tab" aria-selected="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span data-i18n="auth.tab_login">Login</span>
                </button>
                <button id="register-mode-btn" class="auth-mode-btn" type="button" role="tab" aria-selected="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="16" y1="11" x2="22" y2="11"/>
                    </svg>
                    <span data-i18n="auth.tab_register">Register</span>
                </button>
            </div>

            <!-- Password Login Container -->
            <div id="password-login-container">
                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
                            <path d="M12 18h.01"/>
                        </svg>
                    </span>
                    <input type="text" id="login-identifier" class="form-control" placeholder="Phone number or email" data-i18n-placeholder="auth.phone_or_email">
                    <span class="auth-input-suffix">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="14" x="3" y="5" rx="2"/>
                            <circle cx="9" cy="11" r="2"/>
                            <path d="M13 11h4"/>
                            <path d="M13 14h3"/>
                        </svg>
                    </span>
                </div>

                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="login-password" class="form-control" placeholder="Password" data-i18n-placeholder="auth.password">
                </div>

                <div class="auth-remember-row d-flex align-items-center justify-content-between mb-4">
                    <label class="auth-checkbox-label d-flex align-items-center gap-2 m-0" for="remember-me-checkbox">
                        <input type="checkbox" id="remember-me-checkbox" class="auth-checkbox" checked>
                        <span class="small fw-semibold text-secondary">Remember me</span>
                    </label>
                    <button id="forgot-password-btn" class="auth-forgot-link" type="button" data-i18n="auth.forgot_password">Forgot password?</button>
                </div>

                <button id="password-login-btn" class="gy-btn-auth" type="button">
                    <span data-i18n="auth.login_btn">Login</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
            </div>

            <!-- OTP Phone Input Container -->
            <div id="phone-input-container" class="d-none">
                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
                            <path d="M12 18h.01"/>
                        </svg>
                    </span>
                    <input type="tel" id="phone-number" class="form-control" placeholder="Phone Number" maxlength="10">
                </div>
                <button id="send-otp-btn" class="gy-btn-auth" type="button">
                    <span>Next</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
                <p class="auth-footer-text mt-3 text-center small text-muted">Already have an account? <a href="#" onclick="document.getElementById('login-mode-btn').click(); return false;" class="text-success fw-bold">Login</a></p>
            </div>

            <!-- OTP Verification Container -->
            <div id="otp-input-container" class="d-none">
                <p id="otp-destination" class="text-center small text-muted mb-3"></p>
                <div class="auth-input-group mb-3">
                    <input type="text" id="otp-code" class="form-control text-center fs-4 fw-bold" placeholder="******" maxlength="6">
                </div>
                <button id="verify-otp-btn" class="gy-btn-auth" type="button">
                    <span>Verify OTP</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
                <div class="d-flex justify-content-between mt-3">
                    <button id="resend-otp-btn" class="btn btn-link text-success fw-bold p-0 text-decoration-none small" type="button" disabled>Resend OTP</button>
                    <button id="change-phone-btn" class="btn btn-link text-muted p-0 text-decoration-none small" type="button">Change number</button>
                </div>
            </div>

            <!-- Registration Container -->
            <div id="registration-container" class="d-none">
                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" id="user-name" class="form-control" placeholder="Full Name">
                </div>
                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                    </span>
                    <input type="email" id="user-email" class="form-control" placeholder="Email Address">
                </div>
                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="user-password" class="form-control" placeholder="Password">
                    <input type="hidden" id="user-confirm-password">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted ms-1">Register As</label>
                    <select id="user-role" class="form-select gy-input">
                        <option value="passenger">Passenger</option>
                        <option value="driver">Driver</option>
                    </select>
                </div>
                <div id="driver-verification-fields" class="d-none">
                    <div class="auth-input-group mb-3">
                        <input type="text" id="driver-vehicle-number" class="form-control text-uppercase" placeholder="Vehicle Number">
                    </div>
                    <div class="mb-3">
                        <select id="driver-vehicle-type" class="form-select gy-input">
                            <option value="">Select vehicle type</option>
                            <option value="bike">Bike / Scooty</option>
                            <option value="auto">Auto</option>
                        </select>
                    </div>
                    <div class="auth-input-group mb-3">
                        <input type="text" id="driver-vehicle-model" class="form-control" placeholder="Vehicle Model">
                    </div>
                    <div class="auth-input-group mb-3">
                        <input type="text" id="driver-license-number" class="form-control text-uppercase" placeholder="Licence Number">
                    </div>
                    <div class="auth-input-group mb-3">
                        <input type="text" id="driver-upi-id" class="form-control" placeholder="UPI ID">
                    </div>
                    <label class="driver-agreement mb-3 d-flex gap-2 align-items-start" for="driver-agreement-checkbox">
                        <input type="checkbox" id="driver-agreement-checkbox" class="mt-1">
                        <span class="small text-muted">I agree to LiphtUp's Terms &amp; Privacy Policy.</span>
                    </label>
                </div>
                <button id="register-btn" class="gy-btn-auth" type="button">
                    <span>Register</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
            </div>

            <!-- Reset Password Container -->
            <div id="reset-password-container" class="d-none">
                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="reset-password" class="form-control" placeholder="New Password">
                </div>
                <div class="auth-input-group mb-3">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="reset-confirm-password" class="form-control" placeholder="Confirm New Password">
                </div>
                <button id="reset-password-btn" class="gy-btn-auth" type="button">Update Password</button>
                <button id="reset-back-btn" class="auth-footer-link mt-3 w-100 text-center" type="button">Back to login</button>
            </div>

            <div id="recaptcha-container" class="mt-3 d-flex justify-content-center"></div>
            <div id="auth-status" class="auth-status d-none mt-3" role="status"></div>

            <!-- Footer Trust Badges Card (Stacked: Icons Above Text) -->
            <div class="auth-trust-card mt-4">
                <div class="auth-trust-item">
                    <div class="auth-trust-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            <path d="m9 12 2 2 4-4"/>
                        </svg>
                    </div>
                    <div class="auth-trust-text">
                        <strong>Your safety</strong>
                        <small>our priority</small>
                    </div>
                </div>
                <div class="auth-trust-divider"></div>
                <div class="auth-trust-item">
                    <div class="auth-trust-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="auth-trust-text">
                        <strong>Local drivers,</strong>
                        <small>local support</small>
                    </div>
                </div>
                <div class="auth-trust-divider"></div>
                <div class="auth-trust-item">
                    <div class="auth-trust-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
                        </svg>
                    </div>
                    <div class="auth-trust-text">
                        <strong>24/7 customer</strong>
                        <small>assistance</small>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="auth-bg-bottom"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/platform/firebase-init.js"></script>
    <script type="module" src="js/shared/loading.js"></script>
    <script type="module" src="js/shared/login.js?v=2.0.0"></script>
    <script type="module" src="js/shared/password-toggle.js"></script>
    <script type="module" src="js/shared/i18n.js"></script>
    <script type="module">
        import { renderLanguageSwitcher } from './js/shared/i18n.js';
        renderLanguageSwitcher(document.getElementById('auth-lang-switcher'));
    </script>
    <script>
        const up = document.getElementById('user-password');
        const ucp = document.getElementById('user-confirm-password');
        if(up && ucp) {
            up.addEventListener('input', () => { ucp.value = up.value; });
        }
    </script>
</body>
</html>
