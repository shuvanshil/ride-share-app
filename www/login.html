<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1A7A2E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LiphtUp">
    <title>LiphtUp Login</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/liphtup-icon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260621-liphtup-name-only">
</head>
<body>
    <main class="auth-screen login-page d-flex flex-column justify-content-center align-items-center p-4">
        <section class="auth-card w-100">
            <div class="brand-logo text-center mb-4"><img src="assets/liphtup-logo.jpeg" alt="LiphtUp"></div>
            <p class="auth-subtitle text-center mb-4">Fast local rides across Tripura</p>

            <div class="auth-mode-switch" role="tablist" aria-label="Choose login or registration">
                <button id="login-mode-btn" class="auth-mode-btn active" type="button" role="tab" aria-selected="true">Login</button>
                <button id="register-mode-btn" class="auth-mode-btn" type="button" role="tab" aria-selected="false">Register</button>
            </div>

            <div class="auth-entry-heading">
                <h1 id="auth-entry-title">Welcome back</h1>
                <p id="auth-entry-copy">Login with the mobile number linked to your account.</p>
            </div>

            <div id="phone-input-container">
                <label class="form-label">Mobile Number</label>
                <div class="input-group gy-input-group mb-3">
                    <span class="input-group-text">+91</span>
                    <input type="tel" id="phone-number" class="form-control" placeholder="9999999999" maxlength="10" inputmode="numeric" autocomplete="tel-national" aria-describedby="sms-consent-text">
                </div>
                <button id="send-otp-btn" class="gy-btn gy-btn-primary w-100" type="button">Send Login OTP</button>
                <p id="sms-consent-text" class="auth-consent-text mt-3 mb-0">
                    By continuing, you agree to receive a one-time verification SMS. Message and data rates may apply.
                </p>
            </div>

            <div id="otp-input-container" class="d-none">
                <label class="form-label">Enter OTP</label>
                <p id="otp-destination" class="auth-step-text mb-3"></p>
                <input type="text" id="otp-code" class="form-control gy-input text-center mb-3" placeholder="******" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                <button id="verify-otp-btn" class="gy-btn gy-btn-primary w-100" type="button">Verify & Login</button>
                <button id="resend-otp-btn" class="auth-link-btn mt-3" type="button" disabled>Resend OTP</button>
                <button id="change-phone-btn" class="auth-link-btn mt-3" type="button">Use another number</button>
            </div>

            <div id="registration-container" class="d-none">
                <h5 class="fw-bold mb-3">Complete Profile</h5>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="user-name" class="form-control gy-input" placeholder="Rahul Nath" autocomplete="name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="user-email" class="form-control gy-input" placeholder="name@example.com" autocomplete="email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Register As</label>
                    <select id="user-role" class="form-select gy-input">
                        <option value="passenger">Passenger</option>
                        <option value="driver">Driver</option>
                    </select>
                </div>
                <div id="driver-verification-fields" class="d-none">
                    <div class="mb-3">
                        <label class="form-label">Profile Photo URL</label>
                        <input type="url" id="driver-profile-photo" class="form-control gy-input" placeholder="https://example.com/photo.jpg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vehicle Number</label>
                        <input type="text" id="driver-vehicle-number" class="form-control gy-input text-uppercase" placeholder="TR01AB1234">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ride Service</label>
                        <select id="driver-vehicle-type" class="form-select gy-input">
                            <option value="">Select vehicle type</option>
                            <option value="bike">Bike / Scooty</option>
                            <option value="auto">Auto</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vehicle Model</label>
                        <input type="text" id="driver-vehicle-model" class="form-control gy-input" placeholder="Honda Activa 6G">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Driving Licence Number</label>
                        <input type="text" id="driver-license-number" class="form-control gy-input text-uppercase" placeholder="TR0120260000000">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">UPI ID</label>
                        <input type="text" id="driver-upi-id" class="form-control gy-input" placeholder="drivername@upi">
                    </div>
                </div>
                <button id="register-btn" class="gy-btn gy-btn-primary w-100" type="button">Create Account</button>
            </div>

            <div id="recaptcha-container" class="mt-3 d-flex justify-content-center"></div>
            <div id="auth-status" class="auth-status d-none mt-3" role="status" aria-live="polite"></div>
        </section>
    </main>

    <script type="module" src="js/firebase-init.js"></script>
    <script type="module" src="js/login.js?v=20260621-auth-modes"></script>
    <script src="js/pwa.js" defer></script>
</body>
</html>
