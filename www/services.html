<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoYatra Services</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="services-page">
        <header class="services-app-head">
            <div class="brand-logo"><span>Go</span><span>Yatra</span></div>
            <button class="icon-btn" type="button" aria-label="Notifications">!</button>
        </header>

        <section class="services-title-block">
            <h1>Book a Ride</h1>
            <p>Set pickup and destination to start your GoYatra booking.</p>
        </section>

        <section class="services-location-card" aria-label="Ride locations">
            <div class="location-field services-location-field">
                <span class="pickup-dot">●</span>
                <input type="text" id="pickup-input" class="form-control gy-input" placeholder="Detecting your pickup..." readonly>
                <button id="refresh-location-btn" class="field-action services-field-btn" type="button" aria-label="Refresh pickup location">⌖</button>
            </div>
            <div class="location-field services-location-field">
                <span class="drop-pin">📍</span>
                <input type="text" id="drop-input" class="form-control gy-input" placeholder="Where to? e.g., Unakoti">
                <button id="clear-drop-btn" class="field-action services-field-btn" type="button" aria-label="Clear destination">×</button>
            </div>
        </section>

        <section class="services-map-card" aria-label="Passenger live location map">
            <div class="services-map-head">
                <div>
                    <h2>Live pickup map</h2>
                    <p id="services-location-status">Locking your exact location...</p>
                </div>
                <span id="services-gps-pill" class="services-gps-pill">GPS</span>
            </div>
            <div id="map-container" class="services-map-frame">
                <div class="services-map-loading">Loading map...</div>
            </div>
            <div id="fare-quote-box" class="fare-pill services-fare-pill d-none justify-content-between align-items-center">
                <span>Estimated fare</span>
                <strong id="fare-amount">₹0.00</strong>
            </div>
        </section>

        <section class="services-ride-actions">
            <button id="request-ride-btn" class="gy-btn gy-btn-primary w-100" type="button">Find Ride</button>
            <p id="services-action-hint">You will continue booking on the Home screen using the existing live ride engine.</p>
        </section>

        <nav class="bottom-nav services-bottom-nav">
            <button type="button" onclick="window.location.href='index.html'"><span>⌂</span>Home</button>
            <button class="active" type="button"><span>▦</span>Services</button>
            <button type="button" onclick="window.location.href='history.html'"><span>◇</span>History</button>
            <button type="button" onclick="window.location.href='profile.html'"><span>○</span>Profile</button>
        </nav>
    </main>

    <script type="module" src="js/services.js"></script>
</body>
</html>
