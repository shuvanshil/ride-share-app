<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1A7A2E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LiphtUp">
    <title>LiphtUp History</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/liphtup-icon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260731-passenger-nav-cleanurls">
</head>
<body>
    <main class="history-page">
        <header class="history-app-head">
            <div class="brand-logo"><img src="assets/liphtup-logo.jpeg" alt="LiphtUp"></div>
            <div class="app-bar-actions">
                <button class="guest-login-btn d-none" type="button" onclick="window.location.href='/login'">Login</button>
                <button id="history-refresh-btn" class="mini-action" type="button">Refresh</button>
            </div>
        </header>

        <section class="history-title-block">
            <h1>Ride History</h1>
            <p id="history-user-context">Your LiphtUp ride history</p>
        </section>

        <section id="history-summary-grid" class="history-summary-grid d-none" aria-label="Trip summary">
            <div class="history-summary-card">
                <span>Total Trips</span>
                <strong id="history-total-trips">0</strong>
            </div>
            <div class="history-summary-card">
                <span id="history-money-label">Total Fare</span>
                <strong id="history-total-fare">₹0</strong>
            </div>
            <div class="history-summary-card">
                <span>Distance</span>
                <strong id="history-total-distance">0 km</strong>
            </div>
        </section>

        <section class="history-filter-row" aria-label="History filters">
            <button class="history-filter" type="button" data-filter="day">Day</button>
            <button class="history-filter" type="button" data-filter="week">Week</button>
            <button class="history-filter" type="button" data-filter="month">Month</button>
            <button class="history-filter active" type="button" data-filter="all">All</button>
        </section>

        <section id="history-list" class="standalone-history-list">
            <div class="history-loading-card">Loading ride history...</div>
        </section>

        <div id="history-detail-modal" class="modal-layer d-none">
            <div class="gy-modal history-detail-modal">
                <div class="modal-head">
                    <h5>Ride Details</h5>
                    <button id="history-detail-close-btn" class="mini-action" type="button">Close</button>
                </div>
                <div id="history-detail-content" class="history-detail-content"></div>
            </div>
        </div>

        <nav class="bottom-nav history-bottom-nav">
            <button type="button" data-home-link><span class="webicon webicon-home" aria-hidden="true"></span>Home</button>
            <button type="button" data-service-link><span class="webicon webicon-services" aria-hidden="true"></span>Services</button>
            <button class="active" type="button"><span class="webicon webicon-history" aria-hidden="true"></span>History</button>
            <button type="button" onclick="window.location.href='/profile'"><span class="webicon webicon-profile" aria-hidden="true"></span>Profile</button>
        </nav>
    </main>

    <script type="module" src="js/loading.js"></script>
    <script src="js/navigation.js"></script>
    <script type="module" src="js/history.js?v=20260712-history-addresses"></script>
    <script src="js/pwa.js" defer></script>
</body>
</html>
