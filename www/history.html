<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/platform/native-bridge.js"></script>
    <script src="js/platform/routes.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A7A2E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LiphtUp">
    <title>LiphtUp History</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/liphtup-icon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260809-merge-fix">
</head>
<body>
    <main class="history-page">
        <header class="history-app-head">
            <div class="brand-logo"><img src="assets/branding/liphtup-logo.jpeg" alt="LiphtUp"></div>
            <div class="app-bar-actions">
                <button class="guest-login-btn d-none" type="button" onclick="window.location.href='/login.html'" data-i18n="common.login">Login</button>
                <button id="history-refresh-btn" class="mini-action" type="button" data-i18n="common.refresh">Refresh</button>
            </div>
        </header>

        <section class="history-title-block">
            <h1 data-i18n="history.title">Ride History</h1>
            <p id="history-user-context" data-i18n="history.subtitle">Trip by you as passenger</p>
        </section>

        <section id="history-summary-grid" class="history-summary-grid d-none" aria-label="Trip summary">
            <div class="history-summary-card">
                <span data-i18n="history.total_trips">Total Trips</span>
                <strong id="history-total-trips">0</strong>
            </div>
            <div class="history-summary-card">
                <span id="history-money-label" data-i18n="history.total_fare">Total Fare</span>
                <strong id="history-total-fare">₹0</strong>
            </div>
            <div class="history-summary-card">
                <span data-i18n="history.total_distance">Distance</span>
                <strong id="history-total-distance">0 km</strong>
            </div>
        </section>

        <section class="history-filter-row" aria-label="History filters">
            <button class="history-filter" type="button" data-filter="day" data-i18n="history.filter_day">Day</button>
            <button class="history-filter" type="button" data-filter="week" data-i18n="history.filter_week">Week</button>
            <button class="history-filter" type="button" data-filter="month" data-i18n="history.filter_month">Month</button>
            <button class="history-filter active" type="button" data-filter="all" data-i18n="history.filter_all">All</button>
        </section>

        <section id="history-list" class="standalone-history-list">
            <div class="history-loading-card" data-i18n="history.loading_history">Loading ride history...</div>
        </section>

        <div id="history-detail-modal" class="modal-layer d-none">
            <div class="gy-modal history-detail-modal">
                <header class="gy-modal-head">
                    <h2 data-i18n="history.trip_details">Trip Details</h2>
                    <button class="modal-close-btn" type="button" aria-label="Close dialog">&times;</button>
                </header>
                <div class="history-detail-content" id="history-detail-content"></div>
            </div>
        </div>

        <nav class="bottom-nav history-bottom-nav">
            <button type="button" data-home-link><span class="webicon webicon-home" aria-hidden="true"></span><span data-i18n="common.app_name">Home</span></button>
            <button type="button" data-service-link><span class="webicon webicon-services" aria-hidden="true"></span><span data-i18n="common.book_a_ride">Services</span></button>
            <button class="active" type="button"><span class="webicon webicon-history" aria-hidden="true"></span><span data-i18n="history.title">History</span></button>
            <button type="button" onclick="window.location.href='/profile.html'"><span class="webicon webicon-profile" aria-hidden="true"></span><span data-i18n="profile.title">Profile</span></button>
        </nav>
    </main>

    <script type="module" src="js/shared/loading.js"></script>
    <script src="js/shared/navigation.js"></script>
    <script type="module" src="js/shared/history.js?v=2.0.0"></script>
    <script type="module" src="js/shared/i18n.js"></script>
    <script src="js/shared/pwa.js" defer></script>
</body>
</html>
