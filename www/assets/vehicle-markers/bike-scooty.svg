<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="80" height="66">
  <defs>
    <linearGradient id="scooterGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20C997"/>
      <stop offset="100%" stop-color="#0F805D"/>
    </linearGradient>
    <linearGradient id="helmetGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28A745"/>
      <stop offset="100%" stop-color="#145A24"/>
    </linearGradient>
    <linearGradient id="visorVis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="60" cy="88" rx="38" ry="7" fill="#000" opacity="0.2"/>
  <!-- Wheels -->
  <circle cx="28" cy="76" r="12" fill="#222"/>
  <circle cx="28" cy="76" r="6" fill="#AAA"/>
  <circle cx="88" cy="76" r="12" fill="#222"/>
  <circle cx="88" cy="76" r="6" fill="#AAA"/>
  <!-- Rider Body & Backpack -->
  <path d="M 38 42 L 32 45 Q 26 50 28 62 L 40 60 Z" fill="#1C5E32"/> <!-- Backpack -->
  <path d="M 40 35 L 56 36 L 54 58 L 40 58 Z" fill="#222"/> <!-- Jacket -->
  <path d="M 42 58 L 60 58 L 62 74 L 50 74 Z" fill="#2A3B50"/> <!-- Jeans -->
  <!-- Helmet & Rider Head -->
  <circle cx="48" cy="22" r="12" fill="url(#helmetGreen)"/>
  <path d="M 46 16 Q 58 18 56 26 L 46 26 Z" fill="url(#visorVis)" opacity="0.9"/>
  <!-- Scooter Frame (Bright Green) -->
  <path d="M 18 64 C 18 52, 30 48, 48 50 L 78 52 Q 88 52, 85 68 C 82 76, 70 78, 50 78 L 26 78 Q 18 78, 18 64 Z" fill="url(#scooterGreen)"/>
  <!-- Front Shield -->
  <path d="M 72 48 L 86 36 L 92 68 L 76 68 Z" fill="url(#scooterGreen)"/>
  <!-- Seat -->
  <path d="M 30 48 C 30 44, 52 44, 54 50 L 30 50 Z" fill="#111"/>
  <!-- Handlebars -->
  <path d="M 78 32 L 88 32" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Headlight -->
  <circle cx="88" cy="34" r="4" fill="#FFF5CC" stroke="#FFC107" stroke-width="1"/>
</svg>
