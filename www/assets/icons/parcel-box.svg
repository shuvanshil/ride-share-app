<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- Motion / Speed lines on the left -->
  <line x1="8" y1="42" x2="22" y2="42" stroke="#E2B788" stroke-width="3" stroke-linecap="round" />
  <line x1="14" y1="52" x2="26" y2="52" stroke="#E2B788" stroke-width="3" stroke-linecap="round" />
  <line x1="18" y1="62" x2="28" y2="62" stroke="#E2B788" stroke-width="3" stroke-linecap="round" />

  <!-- Shadow below box -->
  <ellipse cx="68" cy="88" rx="42" ry="7" fill="#E8DEF8" opacity="0.6" />

  <!-- Main 3D Isometric Cardboard Box -->
  <!-- Left Side Face -->
  <path d="M30 38 L65 52 L65 84 L30 68 Z" fill="#D99B5B" />
  <!-- Left Side Shading Gradient / Details -->
  <path d="M30 38 L65 52 L65 84 L30 68 Z" fill="url(#leftSideGrad)" />

  <!-- Right Side Face -->
  <path d="M65 52 L105 36 L105 66 L65 84 Z" fill="#C58543" />
  <path d="M65 52 L105 36 L105 66 L65 84 Z" fill="url(#rightSideGrad)" />

  <!-- Top Face -->
  <path d="M65 20 L105 36 L65 52 L30 38 Z" fill="#ECC38D" />
  <path d="M65 20 L105 36 L65 52 L30 38 Z" fill="url(#topFaceGrad)" />

  <!-- Center Packing Tape -->
  <!-- Top Tape -->
  <path d="M47.5 29 L57.5 33 L87.5 44 L77.5 40 Z" fill="#D29A62" opacity="0.8" />
  <path d="M52 24 L62 28 L78 44 L68 40 Z" fill="#D8A56E" />
  
  <!-- Tape across front left fold -->
  <path d="M60 48 L65 50 L65 62 L60 59 Z" fill="#C58747" />
  
  <!-- Tape across right fold -->
  <path d="M65 50 L70 48 L70 60 L65 62 Z" fill="#B77735" />

  <!-- White Shipping Label / Barcode on Front Left -->
  <g transform="translate(48, 60) skewY(21.8) scale(0.9, 1)">
    <rect x="0" y="0" width="14" height="18" rx="1.5" fill="#FFFFFF" />
    <!-- Barcode lines -->
    <rect x="2" y="3" width="1.5" height="7" fill="#334155" />
    <rect x="4.5" y="3" width="1" height="7" fill="#334155" />
    <rect x="6.5" y="3" width="2" height="7" fill="#334155" />
    <rect x="9.5" y="3" width="1" height="7" fill="#334155" />
    <rect x="11.5" y="3" width="1" height="7" fill="#334155" />
    <!-- Label mini text placeholder -->
    <rect x="2" y="12" width="10" height="1.5" rx="0.5" fill="#94A3B8" />
    <rect x="2" y="14.5" width="7" height="1.2" rx="0.5" fill="#CBD5E1" />
  </g>

  <!-- Fragile / Handle with care icon stamp on right side -->
  <g opacity="0.45" transform="translate(82, 48) skewY(-21.8) scale(0.8, 0.8)">
    <path d="M2 1 L6 1 L6 4 C6 5.5 4.5 7 3 7 C1.5 7 0 5.5 0 4 L0 1 Z" fill="#78350F" />
    <line x1="3" y1="7" x2="3" y2="11" stroke="#78350F" stroke-width="1.5" />
    <line x1="0.5" y1="11" x2="5.5" y2="11" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="topFaceGrad" x1="65" y1="20" x2="65" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE7C8" />
      <stop offset="100%" stop-color="#E2B176" />
    </linearGradient>
    <linearGradient id="leftSideGrad" x1="30" y1="38" x2="65" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2B77B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A56728" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="rightSideGrad" x1="65" y1="52" x2="105" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
  </defs>
</svg>
