name: Sensitive Ride Telegram Notification Bot

on:
  schedule:
    # Run every 5 minutes (standard minimum GitHub Actions interval)
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sensitive-ride-telegram
  cancel-in-progress: false

jobs:
  notify-sensitive-rides:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sensitive Ride Notification Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        run: |
          python scripts/send_sensitive_ride_telegram_notifications.py
