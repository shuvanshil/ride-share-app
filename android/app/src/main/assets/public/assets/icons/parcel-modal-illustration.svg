<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Soft organic background cloud shapes -->
  <path d="M45 90 C35 75, 45 55, 65 52 C75 35, 105 32, 125 42 C145 30, 180 36, 190 58 C210 62, 218 85, 205 105 C215 125, 195 145, 175 142 C155 155, 120 155, 100 145 C80 152, 50 142, 45 125 C32 115, 32 100, 45 90 Z" fill="#E8F8EE" opacity="0.85" />
  
  <path d="M25 70 C20 62, 25 50, 36 48 C42 38, 60 38, 70 45 C80 40, 95 44, 100 55 C95 68, 80 75, 65 72 C50 78, 30 78, 25 70 Z" fill="#DCFCE7" opacity="0.6" />
  <path d="M165 60 C160 52, 165 40, 176 38 C182 28, 200 28, 210 35 C220 30, 235 34, 240 45 C235 58, 220 65, 205 62 C190 68, 170 68, 165 60 Z" fill="#DCFCE7" opacity="0.5" />

  <!-- Floating Green Capsule Pill Decor -->
  <rect x="42" y="105" width="14" height="6" rx="3" transform="rotate(-25 42 105)" fill="#86EFAC" />
  <rect x="52" y="118" width="8" height="4" rx="2" transform="rotate(15 52 118)" fill="#BBF7D0" />

  <!-- Dashed delivery route curve to location pin -->
  <path d="M130 110 C155 115, 165 110, 185 92" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" fill="none" />

  <!-- Destination Green Map Pin -->
  <g transform="translate(175, 68)">
    <circle cx="12" cy="12" r="14" fill="#15803D" opacity="0.12" />
    <path d="M12 2 C7.58 2 4 5.58 4 10 C4 15.25 12 22 12 22 C12 22 20 15.25 20 10 C20 5.58 16.42 2 12 2 Z" fill="#15803D" />
    <circle cx="12" cy="10" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Box Cast Shadow -->
  <ellipse cx="115" cy="142" rx="55" ry="12" fill="#D1FAE5" opacity="0.8" />
  <ellipse cx="112" cy="140" rx="46" ry="8" fill="#94A3B8" opacity="0.25" />

  <!-- 3D Isometric Cardboard Box Center -->
  <g transform="translate(48, 15)">
    <!-- Motion lines -->
    <line x1="-12" y1="52" x2="4" y2="52" stroke="#E2B788" stroke-width="3" stroke-linecap="round" />
    <line x1="-6" y1="64" x2="8" y2="64" stroke="#E2B788" stroke-width="3" stroke-linecap="round" />

    <!-- Left Face -->
    <path d="M16 48 L64 68 L64 116 L16 94 Z" fill="#D99B5B" />
    <path d="M16 48 L64 68 L64 116 L16 94 Z" fill="url(#modalBoxLeftGrad)" />

    <!-- Right Face -->
    <path d="M64 68 L118 46 L118 92 L64 116 Z" fill="#C58543" />
    <path d="M64 68 L118 46 L118 92 L64 116 Z" fill="url(#modalBoxRightGrad)" />

    <!-- Top Face -->
    <path d="M64 24 L118 46 L64 68 L16 48 Z" fill="#ECC38D" />
    <path d="M64 24 L118 46 L64 68 L16 48 Z" fill="url(#modalBoxTopGrad)" />

    <!-- Top Packing Tape -->
    <path d="M46 32 L58 37 L88 56 L76 50 Z" fill="#D8A56E" />
    
    <!-- Left Flap Tape -->
    <path d="M57 65 L64 68 L64 84 L57 80 Z" fill="#C58747" />
    
    <!-- Right Flap Tape -->
    <path d="M64 68 L71 65 L71 80 L64 84 Z" fill="#B77735" />

    <!-- White Shipping Label / Barcode on Front Left -->
    <g transform="translate(40, 80) skewY(22.6) scale(1, 1)">
      <rect x="0" y="0" width="16" height="20" rx="2" fill="#FFFFFF" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))" />
      <rect x="2" y="3" width="1.5" height="8" fill="#1E293B" />
      <rect x="4.5" y="3" width="1" height="8" fill="#1E293B" />
      <rect x="6.5" y="3" width="2" height="8" fill="#1E293B" />
      <rect x="9.5" y="3" width="1" height="8" fill="#1E293B" />
      <rect x="11.5" y="3" width="1" height="8" fill="#1E293B" />
      <rect x="13.5" y="3" width="1" height="8" fill="#1E293B" />
      <rect x="2" y="13" width="12" height="2" rx="0.5" fill="#64748B" />
      <rect x="2" y="16" width="8" height="1.5" rx="0.5" fill="#94A3B8" />
    </g>

    <!-- Fragile Stamp on Right -->
    <g opacity="0.4" transform="translate(86, 62) skewY(-22.6) scale(1, 1)">
      <path d="M3 1 L9 1 L9 6 C9 8 7 10 5 10 C3 10 1 8 1 6 L1 1 Z" fill="#78350F" />
      <line x1="5" y1="10" x2="5" y2="15" stroke="#78350F" stroke-width="2" />
      <line x1="1" y1="15" x2="9" y2="15" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="modalBoxTopGrad" x1="64" y1="24" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0D8" />
      <stop offset="100%" stop-color="#E2B176" />
    </linearGradient>
    <linearGradient id="modalBoxLeftGrad" x1="16" y1="48" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2B77B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8C4E14" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="modalBoxRightGrad" x1="64" y1="68" x2="118" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
  </defs>
</svg>
